
name: IronProto - PowerShell Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64, nimr-sav]
    timeout-minutes: 5

    steps:
      - name: Verify IronProto
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "=== NIMR-SAV IRONPROTO ==="
          hostname
          whoami

          Write-Host "=== GIT ==="
          git --version

          Write-Host "=== NODE ==="
          $nodeDir = "C:\tools\node-runner"
          $env:PATH = "$nodeDir;$env:PATH"

          node --version
          npm --version

          Write-Host "=== RUNNER READY ==="
