
name: IronProto - PowerShell Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64, nimr-sav]
    timeout-minutes: 5

    steps:
      - name: Verify IronProto
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Host "=== NIMR-SAV IRONPROTO ==="
          hostname
          whoami
          Get-Date

          Write-Host "=== GIT ==="
          git --version

          Write-Host "=== NODE NVM ==="
          $nodeDir = "C:\nvm4w\nodejs"
          $nodeExe = Join-Path $nodeDir "node.exe"

          if (-not (Test-Path $nodeExe)) {
              throw "Node.js inaccessible: $nodeExe"
          }

          & $nodeExe --version

          $env:PATH = "$nodeDir;$env:PATH"

          Write-Host "=== NODE VIA PATH ==="
          node --version

          Write-Host "=== DIAGNOSTIC COMPLETE ==="
